# This is a Databricks asset bundle definition for dabproject_0106.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject_0106
  uuid: 5330a99f-0201-44de-a002-612d07679d77

include:
  - resources/*.yml
  - resources/*/*.yml
    # /Workspace/Users/wendypan1098@gmail.com/assetbundles_1016/dabproject_0106/resources/jobs/job.yml
    # dabproject_0106/resources/jobs/job.yml
  - resources/*/*/*.yml
    # dabproject_0106/resources/jobs/variables/variables.yml
    # /Workspace/Users/wendypan1098@gmail.com/assetbundles_1016/dabproject_0106/resources/jobs/variables/variables.yml
 

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-c9a2d435-9193.cloud.databricks.com/
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-c9a2d435-9193.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/wendypan1098@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/wendypan1098@gmail.com/PROD_OK/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
